seed: 42
fold: 0
max_epochs: 10
batch_size: 64
num_workers: 4
lr: 1.0e-3
weight_decay: 1.0e-4
accelerator: auto
devices: 1
precision: 32
checkpoint_dir: artifacts/checkpoints
plots_dir: plots
overfit_batches: 0
monitor: val_hierarchical_f1
monitor_mode: max
class_weighting: none
aux_binary_weight: 0.0
scheduler: reduce_on_plateau # "none" | "reduce_on_plateau"
scheduler_factor: 0.5
scheduler_patience: 3
scheduler_min_lr: 1.0e-6
early_stopping: true
early_stopping_patience: 10
