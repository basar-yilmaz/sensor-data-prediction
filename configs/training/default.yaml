seed: 42
max_epochs: 60
batch_size: 64
num_workers: 4
lr: 1.0e-3
weight_decay: 1.0e-4
accelerator: auto
devices: 1
precision: 32
checkpoint_dir: artifacts/checkpoints
model_registry_dir: models
model_artifact_name: temporal_conv_gru_tof.ckpt
push_model_to_dvc: true
model_dvc_remote: bfrb-models
plots_dir: plots
overfit_batches: 0
monitor: val_hierarchical_f1
monitor_mode: max
class_weighting: sqrt_inv_freq
aux_binary_weight: 0.2
scheduler: reduce_on_plateau # "none" | "reduce_on_plateau"
scheduler_factor: 0.5
scheduler_patience: 3
scheduler_min_lr: 1.0e-6
early_stopping: true
early_stopping_patience: 10
