stages:
  prepare:
    cmd: uv run bfrb prepare data.prepare.raw_csv=${prepare.raw_csv}
      data.prepare.prepared_dir=${prepare.prepared_dir}
      data.prepare.min_length=${prepare.min_length}
      data.prepare.nan_threshold=${prepare.nan_threshold}
      data.prepare.gravity=${prepare.gravity}
      data.prepare.sample_hz=${prepare.sample_hz}
      data.prepare.quaternion_eps=${prepare.quaternion_eps}
      data.prepare.tof_missing_sentinel=${prepare.tof_missing_sentinel}
    deps:
      - ${prepare.raw_csv}
      - bfrb_sensors/data/features.py
      - bfrb_sensors/data/prepare.py
      - bfrb_sensors/data/label_encoder.py
    params:
      - prepare
    outs:
      - ${prepare.prepared_dir}/sequences
      - ${prepare.prepared_dir}/index.parquet
      - ${prepare.prepared_dir}/label_encoder.json:
          # Small, deterministic label map: tracked in git, not the DVC cache/remote.
          cache: false

  splits:
    cmd: uv run bfrb splits data.splits.prepared_dir=${splits.prepared_dir}
      data.splits.train_size=${splits.train_size}
      data.splits.val_size=${splits.val_size}
      data.splits.test_size=${splits.test_size}
      data.splits.seed=${seed}
      data.splits.stratify_col=${splits.stratify_col}
      data.splits.group_col=${splits.group_col}
      data.splits.force=${splits.force}
    deps:
      - ${splits.prepared_dir}/index.parquet
      - bfrb_sensors/data/splits.py
    params:
      - splits
      - seed
    outs:
      - ${splits.prepared_dir}/splits.json:
          # Frozen, reproducibility-critical split: tracked in git so every machine
          # shares the identical train/val/test partition (the DVC remote is local).
          cache: false
