[project]
name = "bfrb-sensors"
version = "0.1.0"
description = "Body-Focused Repetitive Behavior detection from wrist-worn multimodal sensor data."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Başar Yılmaz" }]
dependencies = [
  "torch>=2.2,<3",
  "pytorch-lightning>=2.2,<3",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=15,<19",
  "scikit-learn>=1.4,<2",
  "scipy>=1.10,<2",
  "joblib>=1.3,<2",
  "hydra-core>=1.3,<2",
  "fire>=0.6,<1",
  "dvc[s3,http]>=3.50,<4",
  "mlflow>=2.12,<3",
  "torchmetrics>=1.4,<2",
  "matplotlib>=3.8,<4",
  "requests>=2.32,<3",
]

[project.scripts]
bfrb = "bfrb_sensors.commands:main"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "pytest-timeout>=2.3,<3",
  "ruff>=0.5,<1",
  "pre-commit>=3.7,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bfrb_sensors"]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cuda" }]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "PTH", # use pathlib
]
ignore = ["E501"]  # line-length handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:pkg_resources.*",
]
