[project]
name = "bfrb-deploy"
version = "0.1.0"
description = "FastAPI service for BFRB sensor-data gesture classification inference."
requires-python = ">=3.11,<3.12"
authors = [{ name = "Başar Yılmaz" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "torch>=2.7,<3",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scipy>=1.10,<2",
  "joblib>=1.3,<2",
  "scikit-learn>=1.4,<2",
]

[project.scripts]
bfrb-serve = "app.main:run"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-timeout>=2.3,<3",
  "httpx>=0.27,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cuda" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:pkg_resources.*",
  "ignore::starlette.exceptions.StarletteDeprecationWarning",
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
