<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}BFRB Gesture Classifier{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='favicon.svg') }}" />
  <link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}" />
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <div class="brand">
        <div class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22">
            <path d="M3 12a9 9 0 1 0 18 0 9 9 0 0 0-18 0zm9-5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zM8 14a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm8 0a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3z" fill="currentColor"/>
          </svg>
        </div>
        <div>
          <h1 class="brand__title">BFRB Gesture Classifier</h1>
          <p class="brand__subtitle">Body-Focused Repetitive Behavior detection from wrist sensors</p>
        </div>
      </div>
      <div id="status-pill" class="status-pill {% if model_loaded %}status-pill--ok{% else %}status-pill--warn{% endif %}">
        <span class="status-pill__dot" aria-hidden="true"></span>
        <span id="status-pill-text">{% if model_loaded %}Model ready{% else %}Model not loaded{% endif %}</span>
      </div>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <span>checkpoint: <code id="footer-checkpoint">{{ checkpoint or "—" }}</code></span>
      <span>device: <code id="footer-device">{{ device or "—" }}</code></span>
    </div>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
