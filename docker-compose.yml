services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.20.0
    command: >
      mlflow server
      --host 0.0.0.0
      --port 8080
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --serve-artifacts
      --artifacts-destination /mlflow/artifacts
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./mlruns-server:/mlflow
