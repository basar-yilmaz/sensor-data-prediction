seed: 42

prepare:
  raw_csv: data/raw/train.csv
  prepared_dir: data/prepared
  min_length: 10
  nan_threshold: 0.5
  verbose: false
  sequence_id_col: sequence_id
  subject_id_col: subject
  gesture_col: gesture
  step_col: sequence_counter
  orientation_col: orientation
  sequence_type_col: sequence_type
  expected_n_classes: 18

splits:
  prepared_dir: data/prepared
  n_folds: 5
  group_col: subject_id
  stratify_col: gesture
