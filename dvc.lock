schema: '2.0'
stages:
  prepare:
    cmd: uv run bfrb prepare data.prepare.raw_csv=data/raw/train.csv
      data.prepare.prepared_dir=data/prepared data.prepare.min_length=10
      data.prepare.nan_threshold=0.5 data.prepare.gravity=9.81
      data.prepare.sample_hz=200 data.prepare.quaternion_eps=1e-08
      data.prepare.tof_missing_sentinel=-1
