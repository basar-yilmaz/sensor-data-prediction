schema: '2.0'
stages:
  prepare:
    cmd: uv run bfrb prepare data.prepare.raw_csv=data/raw/train.csv
      data.prepare.prepared_dir=data/prepared data.prepare.min_length=10
      data.prepare.nan_threshold=0.5 data.prepare.gravity=9.81
      data.prepare.sample_hz=200 data.prepare.quaternion_eps=1e-08
      data.prepare.tof_missing_sentinel=-1
    deps:
    - path: bfrb_sensors/data/features.py
      hash: md5
      md5: 458011b921a674f1159f0560eadb13fc
      size: 4103
    - path: bfrb_sensors/data/label_encoder.py
      hash: md5
      md5: 64cb20d87e2e34a6ff9e9bd9fc4ada20
      size: 2021
    - path: bfrb_sensors/data/prepare.py
      hash: md5
      md5: 2fdfa4c31ef8cc51f9f9fe19d4252203
      size: 9997
    - path: data/raw/train.csv
      hash: md5
      md5: 72937e5532c5c685afc07b93ce55ac80
      size: 1121545963
    params:
      params.yaml:
        prepare:
          raw_csv: data/raw/train.csv
          prepared_dir: data/prepared
          min_length: 10
          nan_threshold: 0.5
          verbose: false
          sequence_id_col: sequence_id
          subject_id_col: subject
          gesture_col: gesture
          step_col: sequence_counter
          orientation_col: orientation
          sequence_type_col: sequence_type
          expected_n_classes: 18
          gravity: 9.81
          sample_hz: 200
          quaternion_eps: 1e-08
          tof_missing_sentinel: -1
    outs:
