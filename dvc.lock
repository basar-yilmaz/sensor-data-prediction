    - path: data/prepared/sequences
      hash: md5
      md5: aa53c2955536efae7b9cf6f59474a94a.dir
      size: 251599837
      nfiles: 8101
  splits:
    cmd: uv run bfrb splits data.splits.prepared_dir=data/prepared
      data.splits.train_size=0.8 data.splits.val_size=0.1
      data.splits.test_size=0.1 data.splits.seed=42
      data.splits.stratify_col=gesture data.splits.group_col=subject_id
